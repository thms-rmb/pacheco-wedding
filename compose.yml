services:
  app:
    platform: linux/amd64
    build:
      context: ./dockerfiles
      target: app
      args:
        WORDPRESS_VERSION: "7.0"
        WP_CLI_VERSION: "2.12.0"
    volumes:
      - ./wp-files/wp-config.php:/var/www/html/wp-config.php
      - ./wp-files/wp-content:/var/www/html/wp-content
    ports:
      - "8080:80"
    secrets:
      - db_name
      - db_user
      - db_password
  db:
    platform: linux/amd64
    build:
      context: ./dockerfiles
      target: db
    secrets:
      - db_name
      - db_user
      - db_password

secrets:
  db_name:
    environment: DB_NAME
  db_user:
    environment: DB_USER
  db_password:
    environment: DB_PASSWORD
